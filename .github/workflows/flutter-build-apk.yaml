name: Flutter Build APK (Reusable)

on:
  workflow_call:
    inputs:
      artifact-name:
        description: 'Name of the APK artifact'
        required: true
        type: string
      retention-days:
        description: 'Number of days to retain the artifact'
        required: true
        type: number

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: 'stable'
          cache: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: cd apps/mobile_app && flutter pub get

      - name: Build APK
        run: cd apps/mobile_app && flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: apps/mobile_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: ${{ inputs.retention-days }}
