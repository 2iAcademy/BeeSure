name: Deploy to Production

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy (e.g., 1.0.0)'
        required: true
        type: string
      skip_confirmation:
        description: 'Skip manual approval (use with caution)'
        required: false
        type: boolean
        default: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.validate.outputs.version }}

    steps:
      - name: Validate version
        id: validate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi

          # Reject pre-releases in auto deployment
          if [ "${{ github.event_name }}" = "push" ] && [[ "$VERSION" == *"-"* ]]; then
            echo "Pre-release versions cannot be auto-deployed to production"
            echo "Version: $VERSION"
            exit 1
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version validated: $VERSION"

  approval:
    runs-on: ubuntu-latest
    needs: prepare
    environment: production-approval
    if: ${{ github.event_name == 'push' || inputs.skip_confirmation != true }}

    steps:
      - name: Manual approval checkpoint
        run: |
          echo "⏳ Waiting for manual approval to deploy v${{ needs.prepare.outputs.version }} to production..."
          echo "This is a checkpoint to ensure production deployments are reviewed."

  deploy:
    runs-on: ubuntu-latest
    needs: [prepare, approval]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && (needs.approval.result == 'success' || needs.approval.result == 'skipped') }}
    environment: production

    steps:
      - name: Deploy to production server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          VERSION: ${{ needs.prepare.outputs.version }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          MONGO_ROOT_USER: ${{ secrets.MONGO_ROOT_USER }}
          MONGO_ROOT_PASSWORD: ${{ secrets.MONGO_ROOT_PASSWORD }}
          MONGO_DB_NAME: ${{ secrets.MONGO_DB_NAME }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_EXPIRATION: ${{ secrets.JWT_EXPIRATION }}
          RATE_LIMIT_TTL: ${{ secrets.RATE_LIMIT_TTL }}
          RATE_LIMIT_MAX: ${{ secrets.RATE_LIMIT_MAX }}
          CORS_ORIGIN: ${{ secrets.CORS_ORIGIN }}
        run: |
          # Setup SSH
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H $SSH_HOST >> ~/.ssh/known_hosts

          # Deploy via SSH
          ssh -i ~/.ssh/deploy_key $SSH_USER@$SSH_HOST << ENDSSH
            set -e
            cd ~/beesure

            echo "Backing up PostgreSQL database..."
            BACKUP_FILE="backup-\$(date +%Y%m%d-%H%M%S).sql"
            docker exec postgres pg_dump -U $POSTGRES_USER $POSTGRES_DB > backups/\$BACKUP_FILE
            echo "Database backed up to: \$BACKUP_FILE"

            echo "Creating .env file..."
            cat > .env << EOF
          GITHUB_REPOSITORY=${{ github.repository }}
          IMAGE_TAG=$VERSION
          NODE_ENV=production
          POSTGRES_DB=$POSTGRES_DB
          POSTGRES_USER=$POSTGRES_USER
          POSTGRES_PASSWORD=$POSTGRES_PASSWORD
          MONGO_ROOT_USER=$MONGO_ROOT_USER
          MONGO_ROOT_PASSWORD=$MONGO_ROOT_PASSWORD
          MONGO_DB_NAME=$MONGO_DB_NAME
          JWT_SECRET=$JWT_SECRET
          JWT_EXPIRATION=$JWT_EXPIRATION
          RATE_LIMIT_TTL=$RATE_LIMIT_TTL
          RATE_LIMIT_MAX=$RATE_LIMIT_MAX
          CORS_ORIGIN=$CORS_ORIGIN
          EOF

            chmod 600 .env

            echo "Logging into GitHub Container Registry..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            echo "Pulling images..."
            docker compose -f docker-compose.prod.yml pull

            echo "Restarting services..."
            docker compose -f docker-compose.prod.yml down
            docker compose -f docker-compose.prod.yml up -d

            echo "Waiting for services to be healthy..."
            MAX_WAIT=120
            ELAPSED=0

            while [ \$ELAPSED -lt \$MAX_WAIT ]; do
              if docker compose -f docker-compose.prod.yml ps | grep -q "healthy"; then
                echo "Services are healthy!"
                break
              fi

              if [ \$ELAPSED -ge \$MAX_WAIT ]; then
                echo "Healthcheck timeout after \${MAX_WAIT}s"
                docker compose -f docker-compose.prod.yml logs --tail=50
                echo "Manual intervention required - check logs and restore from backup if needed"
                exit 1
              fi

              sleep 5
              ELAPSED=\$((ELAPSED + 5))
              echo "Waiting... \${ELAPSED}s/\${MAX_WAIT}s"
            done

            echo "Cleaning old images..."
            docker image prune -af --filter "until=720h"

            echo "Production deployment successful!"
          ENDSSH

      - name: Deployment summary
        run: |
          echo "### Production Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version:** ${{ needs.prepare.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment:** Production" >> $GITHUB_STEP_SUMMARY
          echo "- **URL:** ${{ vars.PRODUCTION_URL }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Note:** A database backup was created before deployment." >> $GITHUB_STEP_SUMMARY
