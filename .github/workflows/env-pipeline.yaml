name: CI/CD-Dev-Staging

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
         echo "Install dependencies  (env DEV)"
         npm install

      - name: Build App Angular
        run: |
         echo "Build App Angular (env DEV)"
         ng build 

      - name: Angular Tests
        run: |
          echo "Lancement des tests d'Angular (env DEV)"
          ng test 

      - name: Clean pipeline
        run: clean
