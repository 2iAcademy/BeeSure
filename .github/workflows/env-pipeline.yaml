name: Tests & Build

on:
  push:
    branches: [dev, staging, prod]
  pull_request:
    branches: [dev, staging, prod]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Tests API NestJS
  test-api:
    name: Test API NestJS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.api.prod
          target: builder
          push: false
          load: true
          tags: api-test:latest
          cache-from: type=gha,scope=test-api
          cache-to: type=gha,mode=max,scope=test-api

      - name: Run linter
        run: docker run --rm api-test:latest npm run lint

      - name: Run unit tests
        run: docker run --rm api-test:latest npm test

      - name: Run e2e tests
        run: docker run --rm api-test:latest npm run test:e2e

  # Tests Flutter Mobile
  test-flutter:
    uses: ./.github/workflows/flutter-test.yaml

  # Build et Push Images Docker
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: [test-api, test-flutter]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for API
        id: meta-api
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/api
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.api.prod
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Extract metadata for Liquibase
        id: meta-liquibase
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/liquibase
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-

      - name: Build and push Liquibase image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.liquibase
          push: true
          tags: ${{ steps.meta-liquibase.outputs.tags }}
          labels: ${{ steps.meta-liquibase.outputs.labels }}
          cache-from: type=gha,scope=liquibase
          cache-to: type=gha,mode=max,scope=liquibase
