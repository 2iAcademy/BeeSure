name: CI/CD-Dev-Staging

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Setup Angular
        run: npm install -g @angular/cli

      - name: Install dependencies
        run: |
         echo "Install dependencies  (env DEV)"
         echo "workspace github  " ${{GITHUB_WORKSPACE}} 
         npm install

      - name: Build App Angular
        run: |
          echo "Build App Angular (env DEV)"
          cd $GITHUB_WORKSPACE
          ng build 

      - name: Angular Tests
        run: |
          echo "Lancement des tests d'Angular (env DEV)"
          cd $GITHUB_WORKSPACE
          ng test --watch=false --browsers=ChromeHeadless


