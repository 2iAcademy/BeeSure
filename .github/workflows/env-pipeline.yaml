name: CI/CD-Dev-Staging

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BeeSure

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
         echo "Install dependencies  (env DEV)"
          echo "GitHub Workspace: $GITHUB_WORKSPACE"
         npm install

      - name: Lint
        run: npm run lint

      - name: Build App Angular
        run: |
          echo "Build App Angular (env DEV)"
          echo "GitHub Workspace: $GITHUB_WORKSPACE"
          npm run build 

      - name: Angular Tests
        run: |
          echo "Lancement des tests d'Angular (env DEV)"
          cd $GITHUB_WORKSPACE
          npm run test --watch=false --browsers=ChromeHeadless

      - name: Echo message
        run: echo "Tests terminés sur la branche ${{ github.ref_name }}"
