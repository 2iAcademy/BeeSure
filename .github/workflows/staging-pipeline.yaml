name: Deploy Staging

on:
  push:
    branches: [staging]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Tests Flutter Mobile
  test-flutter:
    uses: ./.github/workflows/flutter-test.yaml

  # Build APK Android pour Staging
  build-apk:
    needs: [test-flutter]
    uses: ./.github/workflows/flutter-build-apk.yaml
    with:
      artifact-name: android-apk-staging
      retention-days: 30

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ secrets.STAGING_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to staging server
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd /opt/beesure

            # Créer le fichier .env avec les secrets
            cat > .env << EOF
            GITHUB_REPOSITORY=${{ github.repository }}
            IMAGE_TAG=staging
            NODE_ENV=staging

            # Database PostgreSQL
            POSTGRES_DB=${{ secrets.STAGING_POSTGRES_DB }}
            POSTGRES_USER=${{ secrets.STAGING_POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ secrets.STAGING_POSTGRES_PASSWORD }}

            # MongoDB
            MONGO_ROOT_USER=${{ secrets.STAGING_MONGO_ROOT_USER }}
            MONGO_ROOT_PASSWORD=${{ secrets.STAGING_MONGO_ROOT_PASSWORD }}
            MONGO_DB_NAME=${{ secrets.STAGING_MONGO_DB_NAME }}

            # JWT
            JWT_SECRET=${{ secrets.STAGING_JWT_SECRET }}
            JWT_EXPIRATION=${{ secrets.STAGING_JWT_EXPIRATION }}

            # Rate Limiting
            RATE_LIMIT_TTL=${{ secrets.STAGING_RATE_LIMIT_TTL }}
            RATE_LIMIT_MAX=${{ secrets.STAGING_RATE_LIMIT_MAX }}

            # CORS
            CORS_ORIGIN=${{ secrets.STAGING_CORS_ORIGIN }}

            # Spark
            SPARK_WORKER_CORES=${{ secrets.STAGING_SPARK_WORKER_CORES }}
            SPARK_WORKER_MEMORY=${{ secrets.STAGING_SPARK_WORKER_MEMORY }}
            EOF

            # Login au registry GitHub
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Pull les nouvelles images
            docker compose -f docker-compose.prod.yml pull

            # Redémarrer les services
            docker compose -f docker-compose.prod.yml up -d

            # Nettoyer les anciennes images
            docker image prune -af

            echo "Déploiement staging terminé !"
