# This is a basic workflow to help you get started with Actions

name: CI/CD-Prod

on:
  push:
    branches: [ "prod" ]
  pull_request:
    branches: [ "prod" ]
  # Permet également de lancer manuellement le workflow depuis l'interface
  workflow_dispatch:

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: apps/api/package-lock.json

      - name: Install API dependencies
        run: cd apps/api && npm ci

      - name: Run API tests
        run: cd apps/api && npm test

      - name: Run API e2e tests
        run: cd apps/api && npm run test:e2e

      - name: Run API linting
        run: cd apps/api && npm run lint

      - name: Build API for production
        run: cd apps/api && npm run build

      - name: Echo deployment message
        run: echo "Tests réussis - Déploiement en production sur la branche ${{ github.ref_name }}"
