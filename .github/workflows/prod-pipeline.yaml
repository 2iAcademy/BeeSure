name: Deploy Production

on:
  push:
    branches: [prod]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Tests Flutter Mobile
  test-flutter:
    uses: ./.github/workflows/flutter-test.yaml

  # Build APK Android pour Production
  build-apk:
    needs: [test-flutter]
    uses: ./.github/workflows/flutter-build-apk.yaml
    with:
      artifact-name: android-apk-production
      retention-days: 90

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ secrets.PROD_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to production server
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            cd /opt/beesure

            # Créer le fichier .env avec les secrets
            cat > .env << EOF
            GITHUB_REPOSITORY=${{ github.repository }}
            IMAGE_TAG=prod-${{ github.sha }}
            NODE_ENV=production

            # Database PostgreSQL
            POSTGRES_DB=${{ secrets.PROD_POSTGRES_DB }}
            POSTGRES_USER=${{ secrets.PROD_POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ secrets.PROD_POSTGRES_PASSWORD }}

            # MongoDB
            MONGO_ROOT_USER=${{ secrets.PROD_MONGO_ROOT_USER }}
            MONGO_ROOT_PASSWORD=${{ secrets.PROD_MONGO_ROOT_PASSWORD }}
            MONGO_DB_NAME=${{ secrets.PROD_MONGO_DB_NAME }}

            # JWT
            JWT_SECRET=${{ secrets.PROD_JWT_SECRET }}
            JWT_EXPIRATION=${{ secrets.PROD_JWT_EXPIRATION }}

            # Rate Limiting
            RATE_LIMIT_TTL=${{ secrets.PROD_RATE_LIMIT_TTL }}
            RATE_LIMIT_MAX=${{ secrets.PROD_RATE_LIMIT_MAX }}

            # CORS
            CORS_ORIGIN=${{ secrets.PROD_CORS_ORIGIN }}

            # Spark
            SPARK_WORKER_CORES=${{ secrets.PROD_SPARK_WORKER_CORES }}
            SPARK_WORKER_MEMORY=${{ secrets.PROD_SPARK_WORKER_MEMORY }}
            EOF

            # Login au registry GitHub
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Pull les nouvelles images
            docker compose -f docker-compose.prod.yml pull

            # Redémarrer les services
            docker compose -f docker-compose.prod.yml up -d

            # Nettoyer les anciennes images
            docker image prune -af

            echo "Déploiement production terminé !"
