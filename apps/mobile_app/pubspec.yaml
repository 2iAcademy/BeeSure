name: mobile_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # HTTP client pour communiquer avec l'API NestJS
  http: ^1.1.0

  # Gestion d'état et injection de dépendances
  provider: ^6.1.1
  get_it: ^7.6.4

  # Variables d'environnement et configuration
  flutter_dotenv: ^5.1.0

  # Sérialisation JSON
  json_annotation: ^4.8.1

  # Logging
  logger: ^2.0.2+1

  # Stockage Token
  flutter_secure_storage: ^8.0.0

  # ⭐ FIREBASE - AJOUTÉ
  firebase_core: ^2.24.2
  firebase_messaging: ^14.7.9

  # ⭐ NOTIFICATIONS LOCALES - AJOUTÉ
  flutter_local_notifications: ^18.0.1

  # ⭐ GEOLOCALISATION (pour plus tard) - AJOUTÉ
  geolocator: ^10.1.0
  permission_handler: ^11.0.1

  # ⭐ CACHE LOCAL (pour zones) - AJOUTÉ
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # ⭐ UTILS - AJOUTÉ
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

  # Code generation pour JSON
  build_runner: ^2.4.7
  json_serializable: ^6.7.1

  # ⭐ HIVE GENERATOR - AJOUTÉ
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true

  assets:
    - .env