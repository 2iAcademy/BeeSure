services:

  postgres:
    image: postgis/postgis:17-3.5-alpine
    container_name: beesure_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-beesure}
      POSTGRES_USER: ${POSTGRES_USER:-beesure_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - beesure_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-beesure_admin} -d ${POSTGRES_DB:-beesure}"]
      interval: 30s
      timeout: 10s
      retries: 3

  liquibase:
    build:
      context: .
      dockerfile: docker/Dockerfile.liquibase
    container_name: beesure_liquibase
    environment:
      LIQUIBASE_COMMAND_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-beesure}
      LIQUIBASE_COMMAND_USERNAME: ${POSTGRES_USER:-beesure_admin}
      LIQUIBASE_COMMAND_PASSWORD: ${POSTGRES_PASSWORD:-secret}
      LIQUIBASE_COMMAND_CHANGELOG_FILE: changelog.xml
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - beesure_network

  mongodb:
    image: mongo:8.0.11
    container_name: beesure_mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-secret}
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME:-beesure}
    volumes:
      - mongodb_data:/data/db
    networks:
      - beesure_network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 30s
      timeout: 10s
      retries: 3


  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: beesure_api
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      API_PORT: ${API_PORT:-3000}
      API_HOST: ${API_HOST:-0.0.0.0}
      
      POSTGRES_HOST: postgres
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-beesure}
      POSTGRES_USER: ${POSTGRES_USER:-beesure_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
      
      MONGO_URL: mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASSWORD:-secret}@mongodb:27017/${MONGO_DB_NAME:-beesure}?authSource=admin

    ports:
      - "${API_PORT:-3000}:3000"
    volumes:
      - ./apps/api:/app
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      liquibase:
        condition: service_completed_successfully
    networks:
      - beesure_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    profiles:
      - production

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    container_name: beesure_web
    environment:
      API_BASE_URL: ${API_BASE_URL:-http://localhost:3000/api}
    ports:
      - "${WEB_PORT:-4200}:80"
    volumes:
      - ./apps/web_app:/app
    depends_on:
      - api
    networks:
      - beesure_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    profiles:
      - production

  nginx:
    image: nginx:1.29-alpine
    container_name: beesure_nginx
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
      - api
    networks:
      - beesure_network
    profiles:
      - production
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  spark-master:
    image: apache/spark:4.0.0-java21-python3
    container_name: spark-master
    command: [ "/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master" ]
    ports:
      - "7077:7077"
      - "8083:8080"
    networks:
      - beesure_network
    volumes:
      - ./data:/opt/spark/data
      - ./logs/sparkmaster:/opt/spark/logs

  spark-worker-1:
    image: apache/spark:4.0.0-java21-python3
    container_name: spark-worker-1
    hostname: spark-worker-1
    command: [ "/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077" ]
    depends_on:
      - spark-master
    ports:
      - "8081:8081"
    networks:
      - beesure_network
    volumes:
      - ./data:/opt/spark/data
      - ./logs/spark-worker-1:/opt/spark/logs

  spark-app:
    build:
      context: .
      dockerfile: docker/Dockerfile.spark
    container_name: spark-app
    hostname: spark-app
    depends_on:
      - spark-master
      - spark-worker-1
    networks:
      - beesure_network
    environment:
      - SPARK_MASTER_URL=spark://spark-master:7077
    stdin_open: true
    tty: true
    volumes:
      - ./data:/opt/spark/data
      - ./logs/spark-app:/opt/spark/logs
    command: "/bin/bash"

volumes:
  postgres_data:
    driver: local
  mongodb_data:
    driver: local

networks:
  beesure_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16